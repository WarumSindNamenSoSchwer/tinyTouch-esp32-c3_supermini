dependencies:
  idf:
    version: '>=5.3,<5.4'
  # TinyUSB needs a USB-OTG peripheral. The ESP32-C3 has none, so it must not
  # pull these in: that build uses USB-Serial/JTAG plus BLE HID instead.
  espressif/esp_tinyusb:
    version: '2.2.1'
    rules:
      - if: 'target != esp32c3'
  espressif/tinyusb:
    version: '0.19.0~3'
    rules:
      - if: 'target != esp32c3'
